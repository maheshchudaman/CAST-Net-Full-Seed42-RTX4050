[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castnet-inpainting"
version = "0.1.0"
description = "Reference implementation of CAST-Net image inpainting"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mahesh Patil"}, {name = "Vikas Tiwari"}]

[tool.setuptools.packages.find]
include = ["castnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
